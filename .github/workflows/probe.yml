name: Debug lineups
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt && python scripts/debug_lineups.py 2026-10-31 MTL,TOR,VAN
      - run: |
          git config user.name "nhl-model-bot"; git config user.email "actions@users.noreply.github.com"
          git add results/debug_lineups.json && git commit -m "Lineup debug" && git pull --rebase && git push
