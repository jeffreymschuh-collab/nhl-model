name: Backtest shots on goal

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nhl-model
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/backtest_sog.py
      - name: Save tuned params + report
        run: |
          git config user.name "nhl-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/backtest_sog.json params_sog.json
          git diff --cached --quiet || git commit -m "SOG backtest"
          git pull --rebase && git push
