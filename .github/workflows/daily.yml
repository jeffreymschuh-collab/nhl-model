name: Daily NHL picks

on:
  schedule:
    - cron: "15 16 * * *"   # ~11:15am ET (EST) - early lines
    - cron: "15 22 * * *"   # ~5:15pm ET (EST) - after goalie confirmations
  workflow_dispatch:
    inputs:
      run:
        description: "am or pm (blank = auto)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: nhl-model
  cancel-in-progress: false

jobs:
  picks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run model
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.run }}" ]; then
            python scripts/run_daily.py --run "${{ github.event.inputs.run }}"
          else
            python scripts/run_daily.py
          fi
          python scripts/export_dashboard.py
      - name: Save results
        run: |
          git config user.name "nhl-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data results
          git diff --cached --quiet || git commit -m "Daily run $(date -u +%F_%H%M)"
          git pull --rebase && git push
