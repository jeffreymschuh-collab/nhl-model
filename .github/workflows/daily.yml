name: Daily NHL picks

on:
  schedule:
    - cron: "15 16 * * *"   # ~11:15am ET (EST) - early lines
    - cron: "15 22 * * *"   # ~5:15pm ET (EST) - after goalie confirmations
  workflow_dispatch:
    inputs:
      run:
        description: "am or pm (blank = auto)"
        required: false
        default: ""
      grade_only:
        description: "grade finished picks only (no odds credits)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: nhl-model
  cancel-in-progress: false

jobs:
  picks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Skip backup run if a run already happened recently
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f results/latest.json ]; then
            age=$(python -c "import json,datetime as d;t=d.datetime.fromisoformat(json.load(open('results/latest.json'))['generated_at']);print(int((d.datetime.now(d.timezone.utc)-t).total_seconds()))")
            hr=$(TZ=America/New_York date +%H)
            if [ "$age" -lt 21600 ] || [ "$hr" -ge 19 ] || [ "$hr" -lt 9 ]; then echo "skip=1" >> $GITHUB_OUTPUT; echo "recent run ${age}s ago or late/early ET hour $hr - skipping backup"; fi
          fi
      - run: pip install -r requirements.txt
        if: steps.guard.outputs.skip != '1'
      - name: Run model
        if: steps.guard.outputs.skip != '1'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.grade_only }}" = "true" ]; then
            python scripts/run_daily.py --grade-only
          elif [ -n "${{ github.event.inputs.run }}" ]; then
            python scripts/run_daily.py --run "${{ github.event.inputs.run }}"
          else
            python scripts/run_daily.py
          fi
          python scripts/learn.py || echo "learning step skipped"
          python scripts/export_dashboard.py
      - name: Save results
        if: steps.guard.outputs.skip != '1'
        run: |
          git config user.name "nhl-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data results params.json
          git diff --cached --quiet || git commit -m "Daily run $(date -u +%F_%H%M)"
          git pull --rebase && git push
