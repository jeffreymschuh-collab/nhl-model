name: Probe MoneyPuck access
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          out=results/probe_moneypuck.txt; : > $out
          for u in \
            https://moneypuck.com/moneypuck/playerData/careers/gameByGame/all_teams.csv \
            https://moneypuck.com/moneypuck/playerData/seasonSummary/2026/regular/teams.csv \
            https://moneypuck.com/moneypuck/playerData/seasonSummary/2026/regular/goalies.csv \
            https://moneypuck.com/moneypuck/playerData/seasonSummary/2025/regular/goalies.csv; do
            code=$(curl -s -A "Mozilla/5.0 (personal research)" -o /tmp/f -w '%{http_code} %{size_download}' "$u")
            echo "URL $u -> $code" >> $out
            head -c 1200 /tmp/f | head -2 >> $out; echo >> $out
          done
          git config user.name "nhl-model-bot"; git config user.email "actions@users.noreply.github.com"
          git add $out && git commit -m "MoneyPuck probe" && git pull --rebase && git push
